# Visitor Stats Updater
# Runs on a schedule to fetch aggregate analytics data and commit
# the result to assets/data/visitor-stats.json.
#
# PREREQUISITES:
#   1. Set up an analytics provider (Umami recommended).
#   2. Add the following GitHub repository secrets:
#      - ANALYTICS_API_URL   — your analytics API endpoint for aggregate stats
#      - ANALYTICS_API_TOKEN — API token (never exposed to the browser)
#
# See ANALYTICS_SETUP.md for detailed instructions.

name: Update Visitor Stats

on:
  schedule:
    # Run every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch visitor stats
        env:
          ANALYTICS_API_URL: ${{ secrets.ANALYTICS_API_URL }}
          ANALYTICS_API_TOKEN: ${{ secrets.ANALYTICS_API_TOKEN }}
        run: |
          # This script calls your analytics API and writes the result
          # to assets/data/visitor-stats.json.
          #
          # The JSON must have this shape:
          # {
          #   "visitors": 1234,
          #   "countries": 42,
          #   "topCountries": [
          #     { "name": "China", "count": 500 },
          #     { "name": "United States", "count": 300 }
          #   ]
          # }
          #
          # Replace the curl command below with your provider's API call.
          # Example for Umami:

          if [ -z "$ANALYTICS_API_URL" ]; then
            echo "ANALYTICS_API_URL not set. Skipping."
            exit 0
          fi

          RESPONSE=$(curl -s -H "Authorization: Bearer $ANALYTICS_API_TOKEN" \
            "$ANALYTICS_API_URL")

          # Parse and reshape the response into our format.
          # Adjust the jq filter to match your analytics provider's API response.
          echo "$RESPONSE" | jq '{
            visitors: (.visitors // .uniques // 0),
            countries: (.countries // (.topCountries | length) // 0),
            topCountries: (.topCountries // [])
          }' > assets/data/visitor-stats.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/visitor-stats.json
          git diff --staged --quiet || git commit -m "chore: update visitor stats"
          git push
